# ---------------------------------------------------------------------------
# THE PUBLICATIONS PAGE IS BUILT FROM THIS FILE.
#
# To add a paper: copy one block below, paste it at the TOP (newest first), and
# change the values. Keep the leading "- " and the two-space indentation.
#
#   title    - the paper's title
#   authors  - author list as you want it shown
#   journal  - journal, year, volume/pages
#   pdf      - link that opens the PDF. For open-access papers in PubMed Central
#              this is https://pmc.ncbi.nlm.nih.gov/articles/PMCxxxxxxx/pdf/
#   journal_url - the paper's page on the journal site (use the DOI link)
#   code     - GitHub repository for the analysis code
#   pmid     - PubMed ID, shown as a small link
#
# Only `title` is required. Delete any line you don't have — the corresponding
# link simply won't appear.
# ---------------------------------------------------------------------------

